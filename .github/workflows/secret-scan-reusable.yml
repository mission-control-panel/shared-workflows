name: Mission Control secret scan
on:
  workflow_call:
    inputs:
      enabled:
        required: false
        type: boolean
        default: false
jobs:
  secret-scan:
    if: inputs.enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard until licensed scanner is verified
        run: |
          echo 'Secret scanning is not enabled by default.'
          echo 'Enable only after the organization verifies a supported Gitleaks CLI version and checksum path.'
          exit 1
